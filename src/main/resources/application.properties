spring.application.name=Bono_Vendedor_Skyworth
spring.main.allow-circular-references=true

# ===================================================================
# BASE DE DATOS (Soporta variables de entorno para despliegue / migración)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost/db_bono_skyworth?characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vecom123.}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIKARICP - Pool de conexiones (evita conexiones ilimitadas al DB)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SkyHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/La_Paz
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=${SERVER_PORT:${PORT:7001}}
server.servlet.context-path=/api

# JWT
jwt.secret=${JWT_SECRET:TokenSecret-123456$-SKYWORTH-2026-SecureKey}
jwt.expiration-ms=${JWT_EXPIRATION_MS:31536000000}

# Uploads
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Swagger / SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=false
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.use-management-port=false

# File Upload Limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=70MB

# Logging
logging.level.com.ninabit.smaf=DEBUG

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Jackson JSON Serialization (Evita fallos de serialización con proxies de Hibernate ByteBuddy)
spring.jackson.serialization.fail-on-empty-beans=false

# Spring Data Pageable Limits
# Reducido de 10000 a 500 para evitar reventar la heap con exportaciones masivas
spring.data.web.pageable.max-page-size=500


app.frontend.url=https://bono.skyworth.bo

# URL Permitidas del Frontend (Para producción bono.skyworth.bo)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8081,https://bono.skyworth.bo,https://bono.skyworth.bo}

# ===================================================================
# LOGGING (BITACORA PROFESIONAL E HISTORIAL ROTATIVO)
# ===================================================================
# Archivo base de los logs
logging.file.name=logs/skyworth.log
# Nivel del logging de la aplicacion (INFO es el estandar para ver todo lo general y los requests)
logging.level.com.ninabit.bono=INFO
# Retencion del archivo: si llega a 10MB lo empaca e inicia otro (para evitar llenar disco por siempre)
logging.logback.rollingpolicy.max-file-size=10MB
# Cuantos dias antes de borrar los zips
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/skyworth-%d{yyyy-MM-dd}.%i.log.gz
